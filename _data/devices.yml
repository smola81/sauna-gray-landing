# Compatible watches, grouped by family. Cross-checked 1:1 against the
# Connect IQ manifest (SaunaGray/manifest.xml in the sauna-gray app repo,
# <iq:product id="..."/> entries) — 36 product IDs, 36 names below. Do not
# add a name here without a matching manifest product id; the previous
# version of this page listed families (fēnix 6 series, quatix, tactix,
# D2 Mach 1 Pro, Enduro 2, Mercedes-Benz Venu 2) that were never in the
# manifest and were removed for that reason.
